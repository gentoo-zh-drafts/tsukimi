name: Sync with upstream
on:
  push:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Update mirror
        uses: projg2/crate-dist-mirror-action@v2
        with:
          ssh-private-key: ${{ secrets.ssh_key }}
          # upstream became a cargo workspace in 26.8.3; pycargoebuild refuses
          # the root and wants a member, whose Cargo.lock covers all of them
          directories: crates/tsukimi
          tag-filter: 'v[0-9]*'
